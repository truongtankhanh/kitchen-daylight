packages:
  - apps/*
  - packages/*
  - tools/*

# External packages used by two or more workspace packages (decision 0003).
# Exact versions from decision 0001 only.
catalog:
  eslint: 10.14.0
  prettier: 3.9.10
  rxjs: 7.8.2
  typescript: 6.0.3
  vite: 8.3.5
  vitest: 5.1.0

catalogMode: manual

# Isolated layout, no hoisting to the root (decisions 0003 and 0006 item 1).
nodeLinker: isolated
shamefullyHoist: false

engineStrict: true

# Scoped peer exceptions (decision 0004 section 4). openapi-typescript 7.13.0 declares
# typescript ^5.x; generation and typecheck pass with the pinned 6.0.3 (P4-T8). Removed once
# openapi-typescript declares TypeScript 6 support.
peerDependencyRules:
  allowedVersions:
    'openapi-typescript>typescript': 6.0.3

# Lifecycle-script allowlist (decision 0003): starts empty; each entry is added
# by the task that needs it, with a reason in the pull request.
allowBuilds:
  # Denied (P4-T6): transitive dependencies of @angular/build. Each ships a prebuilt
  # binary per platform through optionalDependencies; the script is only a fallback.
  '@parcel/watcher': false
  esbuild: false
  lmdb: false
  msgpackr-extract: false
  # Denied (P4-T8): usage telemetry of swagger-ui-dist (through @nestjs/swagger); the
  # package works without its install script.
  '@scarf/scarf': false
strictDepBuilds: true
